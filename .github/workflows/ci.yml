name: fixture-graphics
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y libglfw3-dev libgl1-mesa-dev xvfb
      - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build --parallel 2
      - run: ctest --test-dir build --output-on-failure
      - run: python3 tools/check_reports.py build/fixture_cli
      - run: xvfb-run -a env LIBGL_ALWAYS_SOFTWARE=1 ./build/fixture_viewer --example 2 --capture artifacts/opengl.ppm
      - uses: actions/upload-artifact@v4
        with:
          name: opengl-capture-and-reports
          path: artifacts/
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S . -B build
      - run: cmake --build build --config Release
      - run: ctest --test-dir build -C Release --output-on-failure
      - run: python tools/check_reports.py build/Release/fixture_cli.exe
